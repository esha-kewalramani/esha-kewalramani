<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <nav>
        <h1 class="logo">Projects</h1>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="project.html">Projects</a></li>
            <li><a href="skill.html">Skills</a></li>
        </ul>
    </nav>
</header>

<section class="gallery-section">
    <h2 class="gallery-title">My Work</h2>

    <div class="gallery">
        <img src="images/img1.jpg" class="tall" onclick="openLightbox(0)">
        <img src="images/img2.jpg" class="wide" onclick="openLightbox(1)">
        <img src="images/img3.jpg" onclick="openLightbox(2)">
        <img src="images/img4.jpg" class="tall" onclick="openLightbox(3)">
        <img src="images/img5.jpg" class="wide" onclick="openLightbox(4)">
        <img src="images/img6.jpg" onclick="openLightbox(5)">
        <img src="images/img7.jpg" class="tall" onclick="openLightbox(6)">
        <img src="images/img8.jpg" onclick="openLightbox(7)">
        <img src="images/img9.jpg" class="wide" onclick="openLightbox(8)">
        <img src="images/img10.jpg" onclick="openLightbox(9)">
        <img src="images/img11.jpg" class="tall" onclick="openLightbox(10)">
        <img src="images/img12.jpg" onclick="openLightbox(11)">
        <img src="images/img13.jpg" class="wide" onclick="openLightbox(12)">
        <img src="images/img14.jpg" onclick="openLightbox(13)">
        <img src="images/img15.jpg" class="tall" onclick="openLightbox(14)">
        <img src="images/img16.jpg" onclick="openLightbox(15)">
        <img src="images/img17.jpg" class="wide" onclick="openLightbox(16)">
        <img src="images/img18.jpg" onclick="openLightbox(17)">
    </div>
</section>

<div id="lightbox">
    <span class="close" onclick="closeLightbox()">&times;</span>
    <img id="lightbox-img">
    <button class="prev" onclick="changeSlide(-1)">&#10094;</button>
    <button class="next" onclick="changeSlide(1)">&#10095;</button>
    <button class="zoom-in" onclick="zoomIn()">+</button>
    <button class="zoom-out" onclick="zoomOut()">-</button>
</div>

<script src="script.js"></script>
</body>
</html>
