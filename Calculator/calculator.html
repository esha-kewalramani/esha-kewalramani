<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculator</title>
    <link rel="stylesheet" href="../Calculator/calculator.css">
</head>
<body>
    <div class="main-container">
<input type="number" placeholder="0">
<div class="for-buttons">
    <div class="each">
        <button>AC</button>
    <button>7</button>
    <button>4</button>
    <button>1</button>
    <button>00</button>
    </div>
    <div class="each">
        <button>( )</button>
    <button>8</button>
    <button>5</button>
    <button>2</button>
    <button>0</button>
    </div>
    <div class="each">
        <button>%</button>
    <button>9</button>
    <button>6</button>
    <button>3</button>
    <button>.</button>
    </div>
    <div class="each">
    <button>÷</button>
    <button>×</button>
    <button>-</button>
<button>+</button>
    <button class="equal">=</button>
</div>   
</div>
    </div>
</body>
</html>
